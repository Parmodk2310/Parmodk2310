<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Parmod — AI/ML Engineer</title>
  <desc id="desc">Profile banner highlighting reliable machine learning systems, production AI, MLOps, and distributed infrastructure.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#0c2947"/>
      <stop offset="1" stop-color="#12395b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#dbeafe" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1020" cy="40" r="260" fill="url(#glow)"/>
  <circle cx="80" cy="330" r="220" fill="url(#glow)" opacity="0.55"/>

  <g opacity="0.55" stroke="#7dd3fc" stroke-width="1.4">
    <path d="M875 95L960 55L1045 98L1110 54" fill="none"/>
    <path d="M875 95L940 166L1045 98L1115 170" fill="none"/>
    <path d="M940 166L1018 232L1115 170" fill="none"/>
  </g>
  <g fill="#dbeafe" filter="url(#shadow)">
    <circle cx="875" cy="95" r="6"/><circle cx="960" cy="55" r="6"/><circle cx="1045" cy="98" r="7"/><circle cx="1110" cy="54" r="5"/>
    <circle cx="940" cy="166" r="7"/><circle cx="1115" cy="170" r="7"/><circle cx="1018" cy="232" r="8"/>
  </g>

  <rect x="70" y="57" width="66" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="112" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="50" font-weight="800" letter-spacing="1">PARMOD</text>
  <text x="72" y="151" fill="#7dd3fc" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">AI/ML ENGINEER</text>
  <text x="72" y="190" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="18">Reliable ML systems · Production AI products · Cloud-native delivery</text>

  <g font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">
    <rect x="70" y="224" width="142" height="34" rx="17" fill="#0f3d5d" stroke="#38bdf8" stroke-opacity="0.6"/>
    <text x="141" y="246" fill="#bae6fd" text-anchor="middle">ML GOVERNANCE</text>
    <rect x="224" y="224" width="128" height="34" rx="17" fill="#0d463e" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="288" y="246" fill="#a7f3d0" text-anchor="middle">RAG &amp; GENAI</text>
    <rect x="364" y="224" width="174" height="34" rx="17" fill="#313269" stroke="#818cf8" stroke-opacity="0.65"/>
    <text x="451" y="246" fill="#c7d2fe" text-anchor="middle">DISTRIBUTED SYSTEMS</text>
  </g>

  <path d="M0 304C210 275 345 335 555 301C770 266 957 324 1200 286V320H0Z" fill="url(#accent)" opacity="0.7"/>
</svg>
